<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Mustard Seed Gospel Church</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center px-5 py-10">

  <main class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <div class="bg-gradient-to-r from-purple-700 to-indigo-700 px-7 py-8 text-center text-white">
        <div class="mx-auto mb-4 w-14 h-14 rounded-full bg-white/15 flex items-center justify-center">
          <span class="text-2xl">✝</span>
        </div>

        <h1 class="text-2xl font-bold">Mustard Seed Gospel Church</h1>
        <p class="mt-2 text-sm text-purple-100">Admin Portal</p>
      </div>

      <div class="p-7">
        <h2 class="text-xl font-semibold text-slate-900">Admin Login</h2>
        <p class="mt-1 text-sm text-slate-500">
          Sign in to manage the church website.
        </p>

        <form id="loginForm" class="mt-7 space-y-5">

          <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-2">
              Email Address
            </label>
            <input
              id="email"
              type="email"
              autocomplete="email"
              required
              placeholder="admin@example.com"
              class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
            />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-2">
              Password
            </label>

            <div class="relative">
              <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Enter your password"
                class="w-full rounded-lg border border-slate-300 px-4 py-3 pr-12 outline-none transition focus:border-purple-600 focus:ring-2 focus:ring-purple-200"
              />

              <button
                type="button"
                id="togglePassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-500 hover:text-purple-700"
              >
                Show
              </button>
            </div>
          </div>

          <div
            id="message"
            class="hidden rounded-lg px-4 py-3 text-sm"
            role="alert"
          ></div>

          <button
            id="loginButton"
            type="submit"
            class="w-full rounded-lg bg-purple-700 px-4 py-3 font-semibold text-white transition hover:bg-purple-800 disabled:cursor-not-allowed disabled:opacity-60"
          >
            <span id="buttonText">Sign In</span>
          </button>
        </form>

        <div class="mt-6 text-center">
          <a
            href="index.html"
            class="text-sm font-medium text-purple-700 hover:text-purple-900"
          >
            ← Back to website
          </a>
        </div>
      </div>
    </div>

    <p class="mt-5 text-center text-xs text-slate-400">
      Mustard Seed Gospel Church — Home of Success
    </p>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { db } from "./firebase.js";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const buttonText = document.getElementById("buttonText");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.classList.remove(
        "hidden",
        "bg-red-50",
        "text-red-700",
        "bg-green-50",
        "text-green-700"
      );

      if (type === "success") {
        message.classList.add("bg-green-50", "text-green-700");
      } else {
        message.classList.add("bg-red-50", "text-red-700");
      }
    }

    function hideMessage() {
      message.classList.add("hidden");
    }

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "Hide" : "Show";
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      hideMessage();

      if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
      }

      loginButton.disabled = true;
      buttonText.textContent = "Signing in...";

      try {
        const userCredential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        const user = userCredential.user;

        // Verify that this authenticated account is registered
        // as an active administrator in Firestore.
        const adminRef = doc(db, "admins", user.uid);
        const adminSnapshot = await getDoc(adminRef);

        if (!adminSnapshot.exists() || adminSnapshot.data().active !== true) {
          await auth.signOut();
          showMessage("This account is not authorized as an administrator.");
          return;
        }

        showMessage("Login successful. Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "admin-dashboard.html";
        }, 500);

      } catch (error) {
        console.error("Admin login error:", error);

        let errorMessage = "Unable to sign in. Please try again.";

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {
          errorMessage = "Incorrect email or password.";
        } else if (error.code === "auth/invalid-email") {
          errorMessage = "Please enter a valid email address.";
        } else if (error.code === "auth/too-many-requests") {
          errorMessage = "Too many failed attempts. Please try again later.";
        } else if (error.code === "auth/network-request-failed") {
          errorMessage = "Network error. Please check your internet connection.";
        }

        showMessage(errorMessage);
      } finally {
        loginButton.disabled = false;
        buttonText.textContent = "Sign In";
      }
    });

    // If an already signed-in user visits this page, check whether
    // they are an active admin and send them to the dashboard.
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      try {
        const adminRef = doc(db, "admins", user.uid);
        const adminSnapshot = await getDoc(adminRef);

        if (adminSnapshot.exists() && adminSnapshot.data().active === true) {
          window.location.href = "admin-dashboard.html";
        } else {
          await auth.signOut();
        }
      } catch (error) {
        console.error("Admin verification error:", error);
      }
    });
  </script>

</body>
</html>
