<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Login | Mustard Seed Gospel Church</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .church-font {
      font-family: 'Fraunces', serif;
    }
  </style>
</head>

<body class="min-h-screen bg-[#0A1931] flex items-center justify-center px-4">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <div class="w-24 h-24 rounded-full overflow-hidden bg-white flex items-center justify-center shadow-xl">
        <img
          src="file_00000000f484821082c1a5a75b373fed.png"
          alt="Mustard Seed Gospel Church Logo"
          class="w-full h-full object-contain"
        >
      </div>
    </div>

    <!-- Church name -->
    <div class="text-center mb-6">
      <h1 class="church-font text-3xl font-bold text-white">
        Mustard Seed Gospel Church
      </h1>

      <p class="text-[#D4AF37] mt-2 font-medium">
        Home of Success
      </p>
    </div>

    <!-- Login card -->
    <div class="bg-[#F7F7F5] rounded-2xl shadow-2xl p-8">

      <div class="text-center mb-7">
        <h2 class="text-2xl font-bold text-[#0A1931]">
          Admin Login
        </h2>

        <p class="text-gray-500 text-sm mt-2">
          Sign in to manage the church website.
        </p>
      </div>

      <!-- Error message -->
      <div
        id="errorMessage"
        class="hidden mb-5 rounded-lg bg-red-100 border border-red-300 text-red-700 px-4 py-3 text-sm"
      ></div>

      <!-- Login form -->
      <form id="loginForm">

        <!-- Email -->
        <div class="mb-5">
          <label
            for="email"
            class="block text-sm font-semibold text-[#0A1931] mb-2"
          >
            Email Address
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            required
            placeholder="Enter your admin email"
            class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-white outline-none focus:ring-2 focus:ring-[#D4AF37] focus:border-[#D4AF37]"
          >
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label
            for="password"
            class="block text-sm font-semibold text-[#0A1931] mb-2"
          >
            Password
          </label>

          <div class="relative">

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Enter your password"
              class="w-full px-4 py-3 pr-12 rounded-lg border border-gray-300 bg-white outline-none focus:ring-2 focus:ring-[#D4AF37] focus:border-[#D4AF37]"
            >

            <button
              type="button"
              id="togglePassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-[#0A1931]"
            >
              Show
            </button>

          </div>
        </div>

        <!-- Login button -->
        <button
          id="loginButton"
          type="submit"
          class="w-full bg-[#D4AF37] hover:bg-[#c29f2f] text-[#0A1931] font-bold py-3 rounded-lg transition duration-200"
        >
          Login
        </button>

      </form>

      <!-- Loading -->
      <div
        id="loading"
        class="hidden text-center mt-5 text-sm text-gray-600"
      >
        Signing in...
      </div>

    </div>

    <!-- Back to website -->
    <div class="text-center mt-6">
      <a
        href="index.html"
        class="text-white/80 hover:text-[#D4AF37] text-sm"
      >
        ← Back to Church Website
      </a>
    </div>

  </div>


  <!-- Firebase Login -->
  <script type="module">

    import { auth, db } from "./firebase.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");
    const loading = document.getElementById("loading");
    const togglePassword = document.getElementById("togglePassword");


    // Show / hide password
    togglePassword.addEventListener("click", () => {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";
        togglePassword.textContent = "Hide";

      } else {

        passwordInput.type = "password";
        togglePassword.textContent = "Show";

      }

    });


    // Show error
    function showError(message) {

      errorMessage.textContent = message;
      errorMessage.classList.remove("hidden");

    }


    // Hide error
    function hideError() {

      errorMessage.textContent = "";
      errorMessage.classList.add("hidden");

    }


    // Login
    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      hideError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {

        showError("Please enter your email and password.");
        return;

      }


      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";
      loading.classList.remove("hidden");


      try {

        /*
         * STEP 1
         * Sign in with Firebase Authentication.
         */
        const userCredential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        const user = userCredential.user;


        /*
         * STEP 2
         * Check the admin document in Firestore.
         */
        const adminRef = doc(db, "admins", user.uid);

        const adminSnap = await getDoc(adminRef);


        if (!adminSnap.exists()) {

          showError(
            "Your account is not registered as an administrator."
          );

          await auth.signOut();

          return;

        }


        const adminData = adminSnap.data();


        if (adminData.active !== true) {

          showError(
            "Your administrator account is inactive."
          );

          await auth.signOut();

          return;

        }


        /*
         * STEP 3
         * Get the Firebase ID token.
         */
        loading.textContent = "Securing your session...";

        const idToken = await user.getIdToken(true);


        /*
         * STEP 4
         * Send the Firebase ID token to our server.
         *
         * The server will:
         * - verify the token
         * - verify the admin UID
         * - verify active === true
         * - create the HTTP-only __session cookie
         */
        const sessionResponse = await fetch(
          "/api/auth/session",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            credentials: "same-origin",

            body: JSON.stringify({
              idToken: idToken
            })
          }
        );


        const sessionData = await sessionResponse.json();


        /*
         * The server refused to create a session.
         */
        if (!sessionResponse.ok || sessionData.success !== true) {

          await auth.signOut();

          showError(
            sessionData.message ||
            "Unable to create a secure administrator session."
          );

          return;

        }


        /*
         * STEP 5
         * Secure server session successfully created.
         *
         * Now the protected admin page can be opened.
         */
        loading.textContent = "Opening admin dashboard...";

        window.location.replace("/admin-dashboard.html");

      }


      catch (error) {

        console.error("LOGIN ERROR:", error);

        let message =
          "Login failed. Please check your email and password.";


        if (error.code === "auth/invalid-credential") {
          message = "Incorrect email or password.";
        }

        else if (error.code === "auth/user-not-found") {
          message = "No account exists with this email.";
        }

        else if (error.code === "auth/wrong-password") {
          message = "Incorrect password.";
        }

        else if (error.code === "auth/invalid-email") {
          message = "Please enter a valid email address.";
        }

        else if (error.code === "auth/too-many-requests") {
          message =
            "Too many login attempts. Please try again later.";
        }

        else if (error.code === "auth/network-request-failed") {
          message =
            "Network error. Check your internet connection.";
        }

        else if (error.message) {
          message = error.message;
        }


        showError(message);

      }


      finally {

        loginButton.disabled = false;
        loginButton.textContent = "Login";
        loading.classList.add("hidden");

      }

    });

  </script>

</body>
</html>
