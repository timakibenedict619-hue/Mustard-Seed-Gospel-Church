<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Login — Mustard Seed Gospel Church</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0A1931',
            gold: '#D4AF37',
            cream: '#F7F7F5',
          },
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            serif: ['Fraunces', 'serif'],
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .serif {
      font-family: 'Fraunces', serif;
    }
  </style>
</head>


<body class="min-h-screen bg-cream text-navy antialiased">


  <!-- Background -->

  <div class="fixed inset-0 pointer-events-none overflow-hidden">

    <div
      class="absolute -top-40 -right-40 w-[500px] h-[500px] rounded-full opacity-[0.08]"
      style="background:#D4AF37;"
    ></div>

    <div
      class="absolute -bottom-40 -left-40 w-[500px] h-[500px] rounded-full opacity-[0.06]"
      style="background:#0A1931;"
    ></div>

  </div>


  <!-- Main -->

  <main class="relative min-h-screen flex items-center justify-center px-5 py-10">


    <div class="w-full max-w-[440px]">


      <!-- Logo / Brand -->

      <div class="text-center mb-7">

        <div
          class="mx-auto w-[82px] h-[82px] rounded-full overflow-hidden bg-white border-4 border-gold/30 shadow-lg flex items-center justify-center"
        >

          <img
            src="file_00000000f484821082c1a5a75b373fed.png"
            alt="Mustard Seed Gospel Church Logo"
            class="w-full h-full object-cover"
          />

        </div>


        <h1 class="serif mt-5 text-[26px] md:text-[30px] font-bold tracking-[-0.02em] text-navy">
          Mustard Seed Gospel Church
        </h1>


        <p class="mt-1 text-[11px] tracking-[0.22em] uppercase font-bold text-navy/45">
          Home of Success
        </p>

      </div>



      <!-- Login Card -->

      <div
        class="bg-white rounded-[22px] border border-black/[0.06] shadow-[0_20px_60px_rgba(10,25,49,0.10)] overflow-hidden"
      >


        <!-- Card Header -->

        <div class="bg-navy px-7 py-7 text-center text-white">

          <div
            class="mx-auto w-12 h-12 rounded-full bg-white/10 border border-white/10 flex items-center justify-center"
          >

            <span class="serif text-[25px] text-gold">
              ✦
            </span>

          </div>


          <h2 class="serif mt-4 text-[25px] font-semibold">
            Admin Portal
          </h2>


          <p class="mt-1 text-[13px] text-white/60">
            Sign in to manage the church website.
          </p>

        </div>



        <!-- Form -->

        <div class="p-7 md:p-8">

          <form id="loginForm" class="space-y-5">


            <!-- Email -->

            <div>

              <label
                for="email"
                class="block text-[13px] font-semibold text-navy mb-2"
              >
                Email Address
              </label>


              <input
                id="email"
                type="email"
                autocomplete="email"
                required
                placeholder="admin@example.com"
                class="w-full h-12 rounded-xl border border-black/10 bg-white px-4 text-[14px] text-navy outline-none transition focus:border-gold focus:ring-4 focus:ring-gold/10"
              />

            </div>



            <!-- Password -->

            <div>

              <label
                for="password"
                class="block text-[13px] font-semibold text-navy mb-2"
              >
                Password
              </label>


              <div class="relative">

                <input
                  id="password"
                  type="password"
                  autocomplete="current-password"
                  required
                  placeholder="Enter your password"
                  class="w-full h-12 rounded-xl border border-black/10 bg-white px-4 pr-16 text-[14px] text-navy outline-none transition focus:border-gold focus:ring-4 focus:ring-gold/10"
                />


                <button
                  type="button"
                  id="togglePassword"
                  class="absolute right-3 top-1/2 -translate-y-1/2 px-2 py-1 text-[12px] font-semibold text-navy/50 hover:text-navy transition"
                >
                  Show
                </button>

              </div>

            </div>



            <!-- Message -->

            <div
              id="message"
              class="hidden rounded-xl px-4 py-3 text-[13px]"
              role="alert"
            ></div>



            <!-- Login Button -->

            <button
              id="loginButton"
              type="submit"
              class="w-full h-12 rounded-xl bg-navy text-white text-[14px] font-bold tracking-wide transition hover:bg-[#132b50] disabled:cursor-not-allowed disabled:opacity-60 flex items-center justify-center"
            >

              <span id="buttonText">
                Sign In
              </span>

            </button>


          </form>



          <!-- Back -->

          <div class="mt-7 pt-6 border-t border-black/[0.06] text-center">

            <a
              href="/"
              class="text-[13px] font-semibold text-navy/60 hover:text-navy transition"
            >
              ← Back to website
            </a>

          </div>

        </div>

      </div>



      <!-- Footer -->

      <div class="mt-6 text-center">

        <p class="text-[11px] tracking-wide text-navy/35">
          Mustard Seed Gospel Church
        </p>

        <p class="mt-1 text-[10px] uppercase tracking-[0.18em] font-semibold text-navy/25">
          Home of Success
        </p>

      </div>


    </div>

  </main>



  <!-- Firebase / Login -->

  <script type="module">

    import { auth, db } from "./firebase.js";

    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



    const loginForm = document.getElementById("loginForm");

    const emailInput = document.getElementById("email");

    const passwordInput = document.getElementById("password");

    const togglePassword = document.getElementById("togglePassword");

    const message = document.getElementById("message");

    const loginButton = document.getElementById("loginButton");

    const buttonText = document.getElementById("buttonText");



    function showMessage(text, type = "error") {

      message.textContent = text;

      message.classList.remove(
        "hidden",
        "bg-red-50",
        "text-red-700",
        "bg-green-50",
        "text-green-700"
      );


      if (type === "success") {

        message.classList.add(
          "bg-green-50",
          "text-green-700"
        );

      } else {

        message.classList.add(
          "bg-red-50",
          "text-red-700"
        );

      }

    }



    function hideMessage() {

      message.classList.add("hidden");

    }



    <!-- Password visibility -->

    togglePassword.addEventListener("click", () => {

      const isPassword =
        passwordInput.type === "password";


      passwordInput.type =
        isPassword ? "text" : "password";


      togglePassword.textContent =
        isPassword ? "Hide" : "Show";

    });



    <!-- Login -->

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();


      const email =
        emailInput.value.trim();


      const password =
        passwordInput.value;


      hideMessage();


      if (!email || !password) {

        showMessage(
          "Please enter your email and password."
        );

        return;

      }


      loginButton.disabled = true;

      buttonText.textContent = "Signing in...";


      try {

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        /*
         * Check Firestore admin record
         */

        const adminRef =
          doc(db, "admins", user.uid);


        const adminSnapshot =
          await getDoc(adminRef);


        if (
          !adminSnapshot.exists() ||
          adminSnapshot.data().active !== true
        ) {

          await auth.signOut();

          showMessage(
            "This account is not authorized as an administrator."
          );

          return;

        }


        showMessage(
          "Login successful. Redirecting...",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "admin-dashboard.html";

        }, 500);


      } catch (error) {

        console.error(
          "Admin login error:",
          error
        );


        let errorMessage =
          "Unable to sign in. Please try again.";


        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {

          errorMessage =
            "Incorrect email or password.";

        }

        else if (
          error.code === "auth/invalid-email"
        ) {

          errorMessage =
            "Please enter a valid email address.";

        }

        else if (
          error.code === "auth/too-many-requests"
        ) {

          errorMessage =
            "Too many failed attempts. Please try again later.";

        }

        else if (
          error.code === "auth/network-request-failed"
        ) {

          errorMessage =
            "Network error. Please check your internet connection.";

        }


        showMessage(errorMessage);

      }


      finally {

        loginButton.disabled = false;

        buttonText.textContent = "Sign In";

      }

    });



    /*
     * Check existing login
     */

    onAuthStateChanged(auth, async (user) => {

      if (!user) return;


      try {

        const adminRef =
          doc(db, "admins", user.uid);


        const adminSnapshot =
          await getDoc(adminRef);


        if (
          adminSnapshot.exists() &&
          adminSnapshot.data().active === true
        ) {

          window.location.href =
            "admin-dashboard.html";

        }

        else {

          await auth.signOut();

        }

      }

      catch (error) {

        console.error(
          "Admin verification error:",
          error
        );

      }

    });

  </script>


</body>
</html>
